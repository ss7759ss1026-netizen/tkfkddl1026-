name: SAMDADORA Judge Engine Tests

on:
  pull_request:
    paths:
      - "config/judge-rules.json"
      - "scripts/judge_engine.py"
      - "scripts/validate_song.py"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - ".github/workflows/samdadora-judge.yml"
  workflow_dispatch: {}

jobs:
  judge-engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run SAMDADORA Judge Engine tests
        run: pytest tests/test_judge_engine.py -v
