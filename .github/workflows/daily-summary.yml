name: Daily YouTube Playlist Summary

on:
  schedule:
    # 매일 07:00 KST = 전날 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  send-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/daily_summary.py

      # 카카오로 알릴 수 없는 실패(토큰 만료 등)는 GitHub 이슈로 알린다.
      # GitHub 앱 알림을 켜두면 휴대폰으로 바로 와요.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        run: |
          REASON="$(cat failure_reason.txt 2>/dev/null || echo '원인 미상: 로그를 확인해주세요.')"
          TODAY="$(TZ=Asia/Seoul date +%m/%d)"
          BODY="@${OWNER} 🚨 ${TODAY} 아침 레이더 고장

          원인: ${REASON}

          로그: ${RUN_URL}"
          TITLE="🚨 아침 레이더 고장"
          NUM="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title 아침 레이더 고장" --json number --jq '.[0].number // empty')"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
